name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public source scope
        run: |
          test -z "$(git ls-files -- paper docs scripts '*.tex' '*.bib' '*.sty' '*.pkl' '*.pickle' '*.mpack' '*.ckpt' '*.msgpack' '*/checkpoints/*')"

  test:
    needs: source-scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      JAX_PLATFORMS: cpu
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run python -m compileall -q src
      - run: uv run sr-filter --help
      - run: uv run pytest
      - run: uv run sr-filter reproduce --recipe all --input-root . --output-dir outputs/ci-figures
      - run: git diff --exit-code
      - name: Reject non-ignored untracked files
        run: test -z "$(git status --porcelain --untracked-files=normal)"

  package:
    needs: source-scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: uv.lock
      - run: uv build
      - name: Smoke-test installed wheel outside the source tree
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          test_root=$(mktemp -d)
          uv venv "$test_root/venv" --python 3.12
          uv pip install --python "$test_root/venv/bin/python" "$wheel"
          cd "$test_root"
          "$test_root/venv/bin/sr-filter" --help
          test ! -e "$test_root/venv/lib/python3.12/site-packages/outputs"
      - name: Reject source-tree mutations
        run: test -z "$(git status --porcelain --untracked-files=normal)"
