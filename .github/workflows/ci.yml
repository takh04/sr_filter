name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/audit_release.py

  test:
    needs: release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      JAX_PLATFORMS: cpu
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run python -m compileall -q src scripts
      - run: uv run sr-filter --help
      - run: uv run pytest
      - run: uv run sr-filter reproduce --recipe all --input-root . --output-dir outputs/ci-figures
      - run: uv run python scripts/audit_release.py
      - run: git diff --exit-code
      - name: Reject non-ignored untracked files
        run: test -z "$(git status --porcelain --untracked-files=normal)"

  package:
    needs: release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: uv.lock
      - run: uv build
      - name: Smoke-test installed wheel outside the source tree
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          test_root=$(mktemp -d)
          uv venv "$test_root/venv" --python 3.12
          uv pip install --python "$test_root/venv/bin/python" "$wheel"
          cd "$test_root"
          "$test_root/venv/bin/sr-filter" --help
          test ! -e "$test_root/venv/lib/python3.12/site-packages/outputs"
      - name: Reject source-tree mutations
        run: test -z "$(git status --porcelain --untracked-files=normal)"

  manuscript:
    needs: release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAX_PLATFORMS: cpu
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Install TeX build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-bibtex-extra texlive-fonts-recommended texlive-latex-extra texlive-science
      - run: make -C paper clean camera-ready
      - name: Check that only the rebuilt PDF can differ across TeX engines
        run: git diff --exit-code -- . ":(exclude)paper/main.pdf"
      - name: Reject non-ignored untracked files
        run: test -z "$(git ls-files --others --exclude-standard)"
